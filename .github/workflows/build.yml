name: Build firmware
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build-default:
    name: Build epomaker/epomaker_split65:all
    runs-on: ubuntu-latest
    # QMK's official build image: ships arm-none-eabi-gcc, make, python3, pip and
    # the QMK CLI. We still build with the CLI bundled in the pinned submodule
    # (via bin/qmk), not the container's copy. QMK's own CI uses this same image.
    #
    # Toolchain note: the container's arm-none-eabi-gcc can differ from the host's,
    # so an identical source tree produces a different .bin size/md5. This job
    # asserts "it builds" (QMK's bar: `make keyboard:all`), not a fixed hash.
    container: ghcr.io/qmk/qmk_cli:latest
    steps:
      - name: Configure git safe.directory
        # The container's git runs as a different uid than the checkout, so git
        # otherwise refuses to operate on the workspace. QMK's CI does this too.
        run: git config --global --add safe.directory '*'
      - name: Checkout (with the pinned qmk_firmware submodule)
        # submodules: recursive pulls the pinned qmk_firmware commit and its own
        # submodules. Both repos are public, and .gitmodules uses an HTTPS URL, so
        # it clones anonymously without SSH. fetch-depth: 0 gives the full history
        # so the whitespace check below can diff against the parent commit.
        uses: actions/checkout@v7
        with:
          submodules: recursive
          fetch-depth: 0
      - name: Install the tree's Python requirements
        # bin/qmk runs the submodule's lib/python/qmk, which needs these. With no
        # project .venv present it falls back to the container's python3.
        run: pip3 install --no-cache-dir -r qmk_firmware/requirements.txt
      - name: Check for whitespace errors
        # QMK asks for `git diff --check` before committing. Compare the pushed
        # range; on a non-push event (or the root commit) fall back to the tip.
        run: |
          if git rev-parse --verify -q HEAD^ >/dev/null; then
            git diff --check HEAD^ HEAD
          else
            git show --check --oneline HEAD
          fi
      - name: Check keyboard.json is canonically formatted
        # QMK requires `qmk format-json` on this file before submitting. It must be
        # a no-op, i.e. the file is already in QMK's canonical form.
        env:
          QMK_USERSPACE: ""
        run: |
          cp qmk_firmware/keyboards/epomaker/epomaker_split65/keyboard.json /tmp/before.json
          ./bin/qmk format-json -i qmk_firmware/keyboards/epomaker/epomaker_split65/keyboard.json
          diff -u /tmp/before.json qmk_firmware/keyboards/epomaker/epomaker_split65/keyboard.json \
            || { echo "keyboard.json is not canonically formatted; run 'qmk format-json -i' on it"; exit 1; }
      - name: Guard the raw-HID tunneling line coupling
        # The vendor wireless stack tunnels raw HID by #define-ing raw_hid_send
        # to replaced_hid_send at two hardcoded __LINE__ values (see
        # keyboards/linker/wireless/md_raw.h). Those line numbers are the
        # declaration in quantum/raw_hid.h and the call site in quantum/via.c.
        # A submodule bump that shifts either line silently breaks tunneling
        # (raw HID replies then go to the wrong transport), so fail loudly here.
        run: |
          check() {
            file=$1; line=$2; want=$3
            got=$(sed -n "${line}p" "qmk_firmware/${file}")
            case "$got" in
              *"$want"*) echo "OK  ${file}:${line}" ;;
              *) echo "FAIL ${file}:${line} no longer contains '$want' (got: $got)"; \
                 echo "     md_raw.h's line-keyed raw_hid_send remap is broken; update"; \
                 echo "     keyboards/linker/wireless/md_raw.h and this guard."; exit 1 ;;
            esac
          }
          check quantum/raw_hid.h 29 'void raw_hid_send(uint8_t *data, uint8_t length);'
          check quantum/via.c     461 'raw_hid_send(data, length);'
      - name: Build every keymap for the board
        # QMK's bar for a keyboard change is `make keyboard:all`. QMK's build
        # container presets QMK_USERSPACE=/qmk_userspace; there is no userspace
        # repo in CI, so clear it. bin/make also blanks it when the sibling
        # userspace directory is absent.
        env:
          QMK_USERSPACE: ""
        run: ./bin/make epomaker/epomaker_split65:all
      - name: Report the artifacts
        # POSIX sh (not bash): avoid mapfile/process substitution.
        run: |
          found=0
          for bin in $(find qmk_firmware/.build -name 'epomaker_epomaker_split65_*.bin' | sort); do
            found=1
            ls -l "$bin"
            md5sum "$bin"
          done
          test "$found" -eq 1 || { echo "no .bin produced"; exit 1; }
